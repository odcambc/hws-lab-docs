site_name: Wayment-Steele Lab Protocols
site_description: Protocols and SOPs for lab work
exclude_docs: |
  protocols/_template.md

theme:
  name: material
  logo: assets/bucky.png
  favicon: assets/numen-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Start here:
      - start-here/index.md
      - Onboarding: start-here/onboarding.md
      - Contributing: start-here/contributing.md
  - General lab info:
      - general/index.md
      - Ordering and receiving: general/ordering
      - Wet-lab reference: general/wet-lab-reference.md
      - Sterilization and waste: general/sterilization-and-waste.md
  - Protocols:
      - protocols/index.md
      - Molecular biology:
          - DNA extraction: protocols/molecular-biology/dna-extraction.md
          - Electrocompetent cells: protocols/molecular-biology/electrocompetent-cells.md
  - Recipes:
      - recipes/index.md
      - 1× PBS: recipes/pbs.md
      - Salt stocks: recipes/salt-stocks.md
      - Electrophoresis buffers: recipes/electrophoresis-buffers.md
      - Reagent stocks: recipes/reagent-stocks.md
  - Instruments:
      - instruments/index.md

plugins:
  - search
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

copyright: Copyright 2026, Wayment-Steele lab. Licensed under MIT.
